  <div id="lhRoot" style="display:none">
    <div id="lhMeter" aria-label="Sanity meter"></div>
    <div id="lhKeyTag">🔑 Key Holder</div>
    <button type="button" id="lhSetBtn" aria-label="Hotel settings">⚙️ Hotel settings</button>
    <button type="button" id="lhFanfare" aria-label="Call Miss Fanfare">🎩 Call Miss Fanfare</button>
    <div id="lhVision" aria-hidden="true"><i>✦</i><i>👁️</i><i>◇</i><i>✦</i></div>
    <div id="lhCut">
      <div id="lhCutEyes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div id="lhCutCap">Oh no… you're all fizzled!</div>
      <button type="button" id="lhSkip">Skip ▶</button>
    </div>
    <div id="lhCalm">
      <div class="lh-breathe" aria-hidden="true"></div>
      <div id="lhCalmCap">Whew — take a breath. In… and out…</div>
      <button type="button" id="lhCalmSkip">OK</button>
    </div>
    <div id="lhSet">
      <div class="mbox">
        <h2>🏮 Hotel settings</h2>
        <label><input type="checkbox" id="lhVis"> Glitched vision<small>Odd shapes appear when Sanity is low or you're fizzled.</small></label>
        <label><input type="checkbox" id="lhMuff"> Muffled sound<small>Sounds get soft and distant when things get woozy.</small></label>
        <div style="font-weight:900;margin-top:8px">Cancellation</div>
        <small>When a friend rings your doorbell or flips your lights during a fizzle-in-progress:</small>
        <label><input type="radio" name="lhCan" id="lhCanFifty" value="fifty"> 50/50</label>
        <label><input type="radio" name="lhCan" id="lhCanAlways" value="always"> Always</label>
        <label><input type="radio" name="lhCan" id="lhCanNever" value="never"> Never</label>
        <label><input type="checkbox" id="lhSkipKey"> Skip Key Holder<small>Don't pick me as the Key Holder this stay.</small></label>
        <button type="button" class="big green" id="lhSetClose">Done ✅</button>
      </div>
    </div>
    <div id="lhDraw">
      <div class="mbox">
        <h2>🖍️ Wall doodles</h2>
        <div style="font-size:13px;font-weight:700">Stamp shapes only — no typing on the wall.</div>
        <div id="lhStamps">
          <button type="button" data-lhstamp="star" aria-label="Star">⭐</button>
          <button type="button" data-lhstamp="heart" aria-label="Heart">❤</button>
          <button type="button" data-lhstamp="circle" aria-label="Circle">●</button>
          <button type="button" data-lhstamp="square" aria-label="Square">■</button>
          <button type="button" data-lhstamp="squiggle" aria-label="Squiggle">〰️</button>
          <button type="button" data-lhstamp="smile" aria-label="Smile">☺</button>
          <button type="button" data-lhstamp="lantern" aria-label="Lantern">🏮</button>
          <button type="button" data-lhstamp="swirl" aria-label="Swirl">🌀</button>
        </div>
        <div id="lhCols">
          <button type="button" data-lhcol="#ff6b9a" style="background:#ff6b9a" aria-label="Pink"></button>
          <button type="button" data-lhcol="#6b3cff" style="background:#6b3cff" aria-label="Purple"></button>
          <button type="button" data-lhcol="#2ec27e" style="background:#2ec27e" aria-label="Green"></button>
          <button type="button" data-lhcol="#3a86ff" style="background:#3a86ff" aria-label="Blue"></button>
          <button type="button" data-lhcol="#ffd25a" style="background:#ffd25a" aria-label="Yellow"></button>
          <button type="button" data-lhcol="#1d2340" style="background:#1d2340" aria-label="Ink"></button>
        </div>
        <div id="lhWall" role="img" aria-label="Doodle wall"></div>
        <button type="button" class="big gray" id="lhDrawClose">Done ✅</button>
      </div>
    </div>
  </div>
  <button class="fsnear lhnear" id="lhAct"></button>
