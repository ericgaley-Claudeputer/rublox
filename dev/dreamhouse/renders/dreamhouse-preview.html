<!doctype html>
<html><head><meta charset="utf-8"/><title>loading</title>
<style>
html,body{margin:0;background:#b8e8ff;overflow:hidden;font-family:system-ui,sans-serif}
#ui{position:absolute;inset:0;pointer-events:none}
#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(255,255,255,.95);border:3px solid #ffd23f;border-radius:999px;padding:6px 16px;font-weight:900;color:#1d2340;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
#act{position:absolute;left:50%;bottom:196px;transform:translateX(-50%);background:#2ec27e;color:#fff;font-weight:900;border-radius:16px;padding:10px 16px;box-shadow:0 4px 0 #1f9460}
#act small{color:#eafff3}
#bar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(94vw,820px);background:rgba(255,255,255,.95);border:3px solid #ffd23f;border-radius:16px;padding:6px 8px 8px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:3px 0}
.b{border:2px solid #ffe08a;background:#fff;border-radius:10px;padding:4px 8px;font-weight:900;font-size:12px;color:#1d2340}
.on{border-color:#2ec27e;background:#eafaf0;box-shadow:0 0 0 2px #2ec27e}
.dhi{background:#fff8e8;border:2px solid #ffe08a;border-radius:10px;padding:2px 8px;font-weight:900;font-size:13px;color:#1d2340}
.hideui #ui{display:none}
</style>
</head><body>
<div id="ui">
  <div id="hud">🏡 🪙 86 · 🧱12 🪨2 🏖️1 🪵4 🏠8 · Carrying 6 Bricks 🧱</div>
  <div id="act">🧱 Lay a brick <small>E</small></div>
  <div id="bar">
    <div class="row">
      <span class="b">📍 Stake</span><span class="b">🕳️ Dig</span><span class="b">🌀 Mix</span><span class="b">🪣 Pour</span>
      <span class="b on">🧱 Brick</span><span class="b">🪵 Stud</span><span class="b">🪜 Rafter</span><span class="b">🏠 Shingle</span>
      <span class="b">🚪 Frame</span><span class="b">🎨 Paint</span><span class="b">🛋️ Furnish</span><span class="b">🗑️</span>
    </div>
    <div class="row">
      <span class="dhi">🧱<b>12</b></span><span class="dhi">🪨<b>2</b></span><span class="dhi">🏖️<b>1</b></span>
      <span class="dhi">🪵<b>4</b></span><span class="dhi">🏠<b>8</b></span><span class="dhi">🪟<b>0</b></span>
      <span class="dhi">🎨<b>1</b></span><span class="dhi on">🧺 6 brick</span>
    </div>
  </div>
</div>
<script src="./three.min.js"></script>
<script>
(function(){
const THREE=window.THREE, W=900, H=560;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xb8e8ff);
const cam=new THREE.PerspectiveCamera(36,W/H,.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(8,16,6); scene.add(sun);
const fill=new THREE.DirectionalLight(0xfff4e6,0.25); fill.position.set(-6,4,-4); scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(50,48), new THREE.MeshLambertMaterial({color:0x8fd39a}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const walk=new THREE.Mesh(new THREE.BoxGeometry(36,0.15,4.5), new THREE.MeshLambertMaterial({color:0xcfc4a8}));
walk.position.set(0,0.08,8.5); scene.add(walk);

function tex(draw,s){
  s=s||64; const c=document.createElement('canvas'); c.width=c.height=s; const ctx=c.getContext('2d'); draw(ctx,s);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function mat(c,o){return new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));}
function tmat(draw, fallback){ const t=tex(draw); return new THREE.MeshLambertMaterial({map:t, color:0xffffff}); }
const brickM=tmat(function(ctx,s){
  ctx.fillStyle='#b9b3a8'; ctx.fillRect(0,0,s,s);
  const rows=8,bw=s/4,bh=s/rows;
  for(let r=0;r<rows;r++){ const off=(r%2)?bw/2:0;
    for(let k=-1;k<5;k++){ ctx.fillStyle=['#b54a32','#c45b3a','#a43e2a','#c96a42'][(r*3+k+8)%4];
      ctx.fillRect(k*bw+off+1,r*bh+1,bw-2,bh-2); } }
});
const concM=tmat(function(ctx,s){
  ctx.fillStyle='#8d8f8c'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<180;i++){ ctx.fillStyle=i%3?'#9a9c98':'#7a7c78'; ctx.fillRect((i*17)%s,(i*29)%s,2,2); }
});
const wetM=mat(0x6b6e6a);
const woodM=tmat(function(ctx,s){
  ctx.fillStyle='#b07a43'; ctx.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=8){ ctx.fillStyle='#8a5a2b'; ctx.fillRect(0,y,s,1); ctx.fillStyle='#c99059'; ctx.fillRect((y*3)%s,y+3,s*.6,1); }
});
const shingleM=tmat(function(ctx,s){
  ctx.fillStyle='#4a3a36'; ctx.fillRect(0,0,s,s);
  const rows=8,bw=s/4,bh=s/rows;
  for(let r=0;r<rows;r++){ const off=(r%2)?bw/2:0;
    for(let k=-1;k<5;k++){ ctx.fillStyle=['#5c4038','#4a322c','#6a4a40','#3f2c28'][(r+k+8)%4];
      ctx.fillRect(k*bw+off+1,r*bh+1,bw-2,bh-1); } }
});
const dirtM=mat(0x6a4a2c), rustM=mat(0x6d6f72), darkM=mat(0x5a4030), glassM=mat(0xbfe9ff,{transparent:true,opacity:.45,depthWrite:false});

function box(sx,sy,sz,m,x,y,z,parent){
  const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), m);
  o.position.set(x||0,y||0,z||0); (parent||scene).add(o); return o;
}

const BW=.5, BH=.24, BD=.28, COURSES=8;
const X0=-3.5, Z0=-3.5, X1=3.5, Z1=3.5; // slab edges
const midRoot=new THREE.Group(); const doneRoot=new THREE.Group();
scene.add(midRoot); scene.add(doneRoot);

function addSlab(root, wetSet){
  for(let ix=0;ix<7;ix++) for(let iz=0;iz<7;iz++){
    const x=X0+0.5+ix, z=Z0+0.5+iz;
    const key=ix+','+iz;
    if(wetSet && wetSet.skip && wetSet.skip[key]){
      box(.95,.22,.95, dirtM, x, .12, z, root);
      box(.95,.1,.06, woodM, x, .24, z+.44, root);
      box(.95,.1,.06, woodM, x, .24, z-.44, root);
      continue;
    }
    if(wetSet && wetSet.wet && wetSet.wet[key]){ box(1,.26,1, wetM, x, .16, z, root); continue; }
    box(1,.28,1, concM, x, .16, z, root);
  }
}
function wallLen(){ return X1-X0; }
function addBricks(root, maxCourse, leaveOpenings){
  const span=Math.floor(wallLen()/BW);
  const mid=(span/2)|0;
  function isOpen(face,c,k){
    if(!leaveOpenings) return false;
    if(face===0 && k>=mid-1 && k<=mid && c<6) return true;
    if((face===1||face===3) && k>=mid-1 && k<=mid && c>=2 && c<=5) return true;
    return false;
  }
  function pos(face,c,k){
    const off=(c%2)?BW/2:0;
    const along=k*BW+off+BW/2;
    const y=.30+c*BH+BH/2;
    if(face===0) return [X0+along, y, Z0+BD/2, 0];
    if(face===2) return [X1-along, y, Z1-BD/2, 0];
    if(face===1) return [X1-BD/2, y, Z0+along, Math.PI/2];
    return [X0+BD/2, y, Z1-along, Math.PI/2];
  }
  for(let face=0;face<4;face++){
    const limit = typeof maxCourse==='function' ? 99 : maxCourse;
    for(let c=0;c<limit && c<COURSES;c++){
      if(typeof maxCourse==='function' && !maxCourse(face,c)) continue;
      for(let k=0;k<span;k++){
        if(isOpen(face,c,k)) continue;
        if((face===1||face===3) && (k===0 || k===span-1)) continue; // corners belong to the long walls
        // mid-construction: only some faces / leftover gaps
        if(typeof maxCourse==='number' && face===2 && c>2 && k>span-4) continue;
        const p=pos(face,c,k);
        const b=box(BW-.02,BH-.02,BD, brickM, p[0],p[1],p[2], root);
        b.rotation.y=p[3];
      }
    }
  }
}
function addGableBricks(root){
  // stepped bricks on east/west gables, staying under a 0.48 rad roof
  const rise=Math.tan(0.48);
  const span=Math.floor(wallLen()/BW);
  for(const face of [1,3]){
    for(let c=COURSES;c<COURSES+8;c++){
      const y=.30+c*BH+BH/2;
      const wallTop=COURSES*BH+.30;
      // distance from ridge (center z=0) allowed at this height
      const maxOut=(3.15-y)/rise; // half-run remaining
      for(let k=0;k<span;k++){
        const off=(c%2)?BW/2:0;
        const along=k*BW+off+BW/2;
        const zAt = Z0+along; // for east, along is z from Z0
        const dist=Math.abs((Z0+Z1)/2 - (face===1 ? (Z0+along) : (Z1-along)));
        if(dist>maxOut-0.05) continue;
        const x = face===1 ? (X1-BD/2) : (X0+BD/2);
        const z = face===1 ? (Z0+along) : (Z1-along);
        const b=box(BW-.02,BH-.02,BD, brickM, x,y,z, root);
        b.rotation.y=Math.PI/2;
      }
    }
  }
}
function addRoof(root){
  const ridgeY=3.15, half=4.15, thick=.1;
  const rf=box(8.4,.1, half+.3, shingleM, 0, ridgeY, -2.05, root); rf.rotation.x=-0.48;
  const rb=box(8.4,.1, half+.3, shingleM, 0, ridgeY,  2.05, root); rb.rotation.x= 0.48;
  // rafters under (wood) slightly thinner
  for(let i=-3;i<=3;i++){
    const a=box(.1,.08, half, woodM, i*1.15, ridgeY-0.12, -2.0, root); a.rotation.x=-0.48;
    const b=box(.1,.08, half, woodM, i*1.15, ridgeY-0.12,  2.0, root); b.rotation.x= 0.48;
  }
}
function addDoorWindow(root){
  const mid=0, zf=Z0+BD/2+0.02, doorW=1.02, doorH=1.72;
  // door frame sits in the reserved opening
  box(.1,doorH,.16, woodM, mid-doorW/2, .30+doorH/2, zf, root);
  box(.1,doorH,.16, woodM, mid+doorW/2, .30+doorH/2, zf, root);
  box(doorW+.1,.1,.16, woodM, mid, .30+doorH, zf, root);
  box(doorW-.16,doorH-.12,.07, darkM, mid, .30+(doorH-.12)/2, zf-0.02, root);
  box(.06,.06,.04, mat(0xd4a574), mid+0.28, 1.05, zf+0.06, root);
  // windows in the east/west reserved openings (courses 2-5, 2 bricks wide)
  [X0+BD/2, X1-BD/2].forEach(function(x){
    const w=1.02, h=.96, y=.30+2*BH+h/2;
    box(.16,h,.08, woodM, x, y, -w/2, root);
    box(.16,h,.08, woodM, x, y,  w/2, root);
    box(.16,.08,w, woodM, x, y+h/2, 0, root);
    box(.16,.08,w, woodM, x, y-h/2, 0, root);
    box(.06,h-.1,w-.12, glassM, x, y, 0, root);
  });
}
function addMixer(root,x,z){
  const g=new THREE.Group(); g.position.set(x,0,z); root.add(g);
  const drum=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,.9,14), rustM);
  drum.rotation.z=Math.PI/2; drum.position.set(0,.85,0); g.add(drum);
  [[-.35,.25],[-.35,-.25],[.35,.25],[.35,-.25]].forEach(function(p){ box(.08,.7,.08, darkM, p[0], .35, p[1], g); });
  box(.7,.25,.45, rustM, 1.15, .35, 0, g); // barrow
  box(.5,.16,.34, wetM, 1.15, .5, 0, g);
  // cement bags
  box(.45,.22,.3, mat(0xcfc4a8), -1.0, .2, .4, g);
  box(.45,.22,.3, mat(0xcfc4a8), -1.0, .2, -.1, g);
  box(.45,.22,.3, mat(0xe5c574), -1.0, .2, -.55, g);
}
function addBrickPile(root,x,z,n){
  let i=0;
  for(let y=0;y<5 && i<n;y++) for(let r=0;r<3 && i<n;r++) for(let c=0;c<4 && i<n;c++,i++){
    box(BW-.02,BH-.02,BD, brickM, x+c*BW*.7, .16+y*BH, z+r*BD*.8, root);
  }
}

// MID scene
addSlab(midRoot, {skip:{'0,0':1,'0,1':1}, wet:{'1,0':1,'2,0':1}});
function midCourses(face,c){
  if(face===0) return c<5;      // south almost up
  if(face===1) return c<3;      // east half
  if(face===3) return c<4;      // west
  if(face===2) return c<2;      // north just started
  return false;
}
addBricks(midRoot, midCourses, true);
addMixer(midRoot, 5.8, -1.4);
addBrickPile(midRoot, 5.4, 2.0, 28);
// a couple of loose bricks on the slab
box(BW-.02,BH-.02,BD, brickM, 0, .42, -2.8, midRoot);
box(BW-.02,BH-.02,BD, brickM, .55, .42, -2.8, midRoot);

// DONE scene
addSlab(doneRoot);
addBricks(doneRoot, COURSES, true);
addGableBricks(doneRoot);
addRoof(doneRoot);
addDoorWindow(doneRoot);
// modest furniture peeking past the door
box(.9,.32,.5, mat(0x3a86ff), -1.1, .5, -1.2, doneRoot);
box(.7,.08,.7, woodM, .8, .55, -.4, doneRoot);

function shot(kind){
  midRoot.visible = kind!=='done';
  doneRoot.visible = kind==='done';
  document.body.className = kind==='hud' ? '' : 'hideui';
  if(kind==='done'){ cam.position.set(7.4, 3.8, -9.6); cam.lookAt(0,1.35,0); }
  else if(kind==='hud'){ cam.position.set(11.2, 6.2, 9.4); cam.lookAt(1.2,0.9,0.2); }
  else { cam.position.set(11.6, 6.4, 9.8); cam.lookAt(1.4,0.8,0.3); } // mid
  renderer.render(scene,cam);
}
shot('mid');
document.title='ready';
document.body.setAttribute('data-ready','1');
window.__rerender=shot;
})();
</script></body></html>
