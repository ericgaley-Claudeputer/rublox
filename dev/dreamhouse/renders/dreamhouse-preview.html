<!doctype html>
<html><head><meta charset="utf-8"/><title>loading</title>
<style>
html,body{margin:0;background:#b8e8ff;overflow:hidden;font-family:system-ui,sans-serif}
#ui{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
#hud{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(255,255,255,.94);border:3px solid #ffd23f;border-radius:999px;padding:6px 16px;font-weight:900;color:#1d2340;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,760px);background:rgba(255,255,255,.94);border:3px solid #ffd23f;border-radius:16px;padding:6px 8px 8px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:3px 0}
.b,.p{border:2px solid #ffe08a;background:#fff;border-radius:10px;padding:4px 8px;font-weight:900;font-size:13px;color:#1d2340}
.p{display:flex;flex-direction:column;align-items:center;min-width:54px;line-height:1.1}
.p small{font-size:9px;color:#6b7290}
.on{border-color:#2ec27e;background:#eafaf0;box-shadow:0 0 0 2px #2ec27e}
.c{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px #cfc4a8}
.c.on{box-shadow:0 0 0 3px #1d2340}
#act{position:absolute;left:50%;bottom:188px;transform:translateX(-50%);background:#2ec27e;color:#fff;font-weight:900;border-radius:16px;padding:10px 16px;box-shadow:0 4px 0 #1f9460}
#act small{color:#eafff3}
.hideui #ui{display:none}
</style>
</head><body>
<div id="ui">
  <div id="hud">🏡 🪙 142 · 🧱 28 · 1F 🏗️</div>
  <div id="act">🧱 Place Wall · 3🪙 <small>E</small></div>
  <div id="bar">
    <div class="row">
      <span class="b on">🏗️ Place</span><span class="b">🎨 Paint</span><span class="b">🗑️ Delete</span>
      <span class="b on">1F</span><span class="b">2F</span><span class="b">↻</span>
    </div>
    <div class="row">
      <span class="c on" style="background:#f6e3b4"></span>
      <span class="c" style="background:#ffb3c7"></span>
      <span class="c" style="background:#bfe3ff"></span>
      <span class="c" style="background:#c8f0c0"></span>
      <span class="c" style="background:#ffe08a"></span>
      <span class="c" style="background:#c39bff"></span>
      <span class="c" style="background:#ff9f6b"></span>
      <span class="c" style="background:#fffaf0"></span>
    </div>
    <div class="row">
      <span class="p">🟫<small>Floor · 2</small></span>
      <span class="p on">🧱<small>Wall · 3</small></span>
      <span class="p">🚪<small>Door · 6</small></span>
      <span class="p">🪟<small>Window · 5</small></span>
      <span class="p">🪜<small>Stairs · 8</small></span>
      <span class="p">🏠<small>Roof · 4</small></span>
      <span class="p">🛋️<small>Sofa · 10</small></span>
      <span class="p">🛏️<small>Bed · 12</small></span>
      <span class="p">🪑<small>Table · 8</small></span>
      <span class="p">💡<small>Lamp · 6</small></span>
      <span class="p">🪴<small>Plant · 4</small></span>
      <span class="p">🧶<small>Rug · 5</small></span>
    </div>
  </div>
</div>
<script src="./three.min.js"></script>
<script>
(function(){
const THREE=window.THREE, W=900, H=560;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xb8e8ff);
const cam=new THREE.PerspectiveCamera(36,W/H,.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.75); sun.position.set(8,16,6); scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48), new THREE.MeshLambertMaterial({color:0x8fd39a}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const walk=new THREE.Mesh(new THREE.BoxGeometry(28,0.15,4), new THREE.MeshLambertMaterial({color:0xcfc4a8}));
walk.position.set(0,0.08,6.2); scene.add(walk);
function mat(c,o){return new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));}
function box(sx,sy,sz,c,x,y,z,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), typeof c==='object'?c:mat(c));
  m.position.set(x||0,y||0,z||0); (parent||scene).add(m); return m;
}
const CELL=1.4, coat=0xf6e3b4, trim=0xff9f6b, wood=0x8b4513, soft=0xffe0ef;
const house=new THREE.Group(); scene.add(house);
// floor grid 5x4
for(let x=0;x<5;x++) for(let z=0;z<4;z++) box(CELL,.18,CELL,coat, (x-2)*CELL, .12, (z-1.5)*CELL, house);
// walls
for(let x=0;x<5;x++){
  if(x!==2) box(CELL,2.1,.22,coat, (x-2)*CELL, 1.2, -1.5*CELL+.35, house);
  box(CELL,2.1,.22,coat, (x-2)*CELL, 1.2, 2.5*CELL-.35, house);
}
for(let z=0;z<4;z++){
  box(.22,2.1,CELL,coat, -2*CELL-.35, 1.2, (z-1.5)*CELL, house);
  if(z!==1) box(.22,2.1,CELL,coat, 2*CELL+.35, 1.2, (z-1.5)*CELL, house);
}
// door
box(.28,2,.22,coat, -CELL*.35, 1.15, -1.5*CELL+.35, house);
box(.28,2,.22,coat,  CELL*.35, 1.15, -1.5*CELL+.35, house);
box(.9,.22,.22,coat, 0, 2.1, -1.5*CELL+.35, house);
box(.55,1.55,.08,wood, 0, .95, -1.5*CELL+.35, house);
// windows
[-CELL, CELL].forEach(function(x){
  box(.7,1.0,.08, mat(0xbfe9ff,{transparent:true,opacity:.5}), x, 1.35, -1.5*CELL+.4, house);
});
// A-frame roof meeting at a ridge (along X)
const roofF=box(CELL*5.5,.2,CELL*3.1, trim, 0, 3.05, -1.15, house); roofF.rotation.x=-0.48;
const roofB=box(CELL*5.5,.2,CELL*3.1, trim, 0, 3.05,  1.35, house); roofB.rotation.x= 0.48;
box(.18,1.1,CELL*4.0, coat, -2*CELL-0.05, 2.7, 0.1, house);
box(.18,1.1,CELL*4.0, coat,  2*CELL+0.05, 2.7, 0.1, house);
// furniture
box(.95,.32,.5, 0x3a86ff, -1.2, .45, .2, house);
box(.95,.35,.16,0x3a86ff, -1.2, .72, -.02, house);
box(1.1,.28,.7, 0xfffaf0, 1.3, .4, .6, house);
box(.4,.18,.68, soft, 1.3, .62, .85, house);
box(.7,.08,.7, 0xd4a574, 0, .55, .3, house);
[-.28,.28].forEach(function(dx){[-.28,.28].forEach(function(dz){ box(.08,.42,.08,0x5a4030, dx, .3, .3+dz, house); });});
box(.22,.16,.22,0x5a4030, 1.6, .2, -1.1, house);
const leaf=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6), mat(0x2ec27e)); leaf.position.set(1.6,.5,-1.1); house.add(leaf);
const lamp=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8), mat(0xffe08a,{emissive:0xffe08a,emissiveIntensity:.45}));
lamp.position.set(-1.6,.9,-.8); house.add(lamp);
box(.12,.7,.12,0x5a4030, -1.6,.4,-.8, house);
box(CELL*.9,.04,CELL*.7, 0xc39bff, 0, .24, .9, house);
// fence posts around plot
for(let i=-4;i<=4;i++){
  box(.12,.7,.12,0xfffaf0, i*1.15, .4, -3.6, house);
  box(.12,.7,.12,0xfffaf0, i*1.15, .4, 3.8, house);
}

function shot(kind){
  document.body.className = kind==='ui' ? '' : 'hideui';
  if(kind==='ui'){ cam.position.set(6.6, 4.0, -9.8); cam.lookAt(0,1.15,0); }
  else { cam.position.set(7.8, 4.4, -10.6); cam.lookAt(0,1.1,0); }
  renderer.render(scene,cam);
}
shot('house');
document.title='ready';
document.body.setAttribute('data-ready','1');
window.__rerender=shot;
})();
</script></body></html>
