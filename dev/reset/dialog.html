<div class="modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
  <div class="mbox">
    <span class="emoji" id="resetEmoji">♻️</span>
    <h2 id="resetTitle">Reset a game?</h2>
    <p class="stats" id="resetBody">This erases its progress and can't be undone.</p>
    <p class="stats" id="resetHint" hidden>Type RESET or press Confirm again.</p>
    <input id="resetType" type="text" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Type RESET to confirm" hidden>
    <div class="resetacts">
      <button class="big gray" id="resetCancel" type="button">Cancel</button>
      <button class="big red" id="resetConfirm" type="button">Confirm</button>
    </div>
  </div>
</div>
